name: CI (CPU checks)

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate package env
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      - name: Report CUDA availability (expected false on hosted runners)
        run: julia --project -e 'using CUDA; println("CUDA.functional() = ", CUDA.functional())'

      - name: Run tests (GPU suite skips cleanly without CUDA)
        run: julia --project -e 'using Pkg; Pkg.test()'

      - name: Build and deploy docs
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate(); include("docs/make.jl")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
